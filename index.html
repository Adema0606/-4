<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rivo — Discover Your Own Fashion</title>
    <!-- Шрифты Google: Playfair Display для заголовков, Poppins для текста -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ========== ШАПКА ========== -->
<header>
    <!-- Логотип слева -->
    <div class="logo">Rivo</div>

    <!-- Меню по центру -->
    <nav class="menu">
        <a href="#">HOME</a>
        <a href="#">SHOP</a>
        <a href="#">FEATURES</a>
        <a href="#">CONTACT</a>
    </nav>

    <!-- Корзина и кнопка LOGIN справа -->
    <div class="header-right">
        <button class="cart">
        <img src="images/korzin.png" alt="Korzina">
        </button>
        <button class="login-btn">LOGIN</button>
    </div>
</header>

<!-- ========== HERO (главный экран) ========== -->
<section class="hero">
    <!-- Левая часть: заголовок, текст, кнопка -->
    <div class="hero-text">
        <h1>Discover and<br>Find Your Own<br>Fashion!</h1>
        <p>Explore our curated collection of stylish
            clothing and accessories tailored to your 
            unique taste.</p>
        <button class="explore-btn">EXPLORE NOW</button>
    </div>

    <!-- Правая часть: картинка девушки -->
    <div class="hero-image">
        <img src="images/hero.png" alt="Fashion model">
    </div>
</section>


</body>
</html>
